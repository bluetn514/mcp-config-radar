[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-config-radar"
version = "0.1.0"
description = "Compare MCP server configs across AI coding tools with secret-safe, CI-friendly reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bluetn514" }]
keywords = ["mcp", "model-context-protocol", "ai", "developer-tools", "configuration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
mcp-config-radar = "mcp_config_radar.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_config_radar*"]
